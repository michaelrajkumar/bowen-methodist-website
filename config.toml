baseURL = "https://bowenmethodist.church"
defaultContentLanguage = "en"
title = "Bowen Memorial Methodist Church"
theme = "bowen-theme"
enableRobotsTXT = true

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepWhitespace = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "Bowen Memorial Methodist Church - Building Faith, Fostering Community, Inspiring Lives"
  author = "Bowen Memorial Methodist Church"
  logo = "/images/logo.webp"

  [params.social]
    facebook = "https://www.facebook.com/bowenmchurch"
    instagram = "https://instagram.com/bowenmemorialmethodistchurch"
    youtube = "https://www.youtube.com/@bowenchurch"

